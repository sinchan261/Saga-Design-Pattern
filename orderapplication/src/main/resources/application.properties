spring.application.name=orderapplication
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/springo
spring.datasource.username =root
spring.datasource.password =root
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
#kafka-configuration
spring.kafka.bootstrap-servers=localhost:8093,localhost:8094,localhost:8090
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.linger.ms=0
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.consumer.group-id=orders-ms
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
orders.events.topic.name=orders-events
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.CoreService.CoreApplication.*
spring.kafka.producer.retries=10
products.commands.topic.name=product-commands
products.events.topic.name=products-events
payment.commands.topic.name=payments-commands